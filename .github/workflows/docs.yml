name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      # Generating equation lemmas for all dependencies exhausts the memory of the runner.
      DISABLE_EQUATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add swap space and allow memory overcommit
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo fallocate -l 12G /mnt/docs-swap
          sudo chmod 600 /mnt/docs-swap
          sudo mkswap /mnt/docs-swap
          sudo swapon /mnt/docs-swap
          free -h
      - uses: leanprover/lean-action@v1
      - name: Redirect the site root to the API documentation
        run: |
          mkdir -p site
          echo '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/"><title>FCA</title><a href="docs/">API documentation</a>' > site/index.html
      - uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # main
        with:
          homepage: site
          build-page: false
          references: docs/references.bib
